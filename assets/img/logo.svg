<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Logotipo institucional">
  <title>Logotipo institucional</title>
  <!-- Marcador de posición: reemplázalo por el logotipo real de la institución.
       Mantén el archivo como assets/img/logo.svg para no tocar el resto del sitio. -->
  <defs>
    <clipPath id="mark-clip"><circle cx="60" cy="60" r="58"/></clipPath>
  </defs>
  <g clip-path="url(#mark-clip)">
    <circle cx="60" cy="60" r="58" fill="#FBF5E8"/>
    <path d="M-4 84c20-10 38-6 58-2s44 0 70-8v50H-4z" fill="#E3EFE0"/>
    <!-- Brote: crecimiento -->
    <path d="M60 62v-18" stroke="#2E6B3E" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M60 50c-7 0-12-5-12-12 7 0 12 5 12 12z" fill="#4E9B45"/>
    <path d="M60 44c0-7 5-12 12-12 0 7-5 12-12 12z" fill="#3C8544"/>
    <!-- Libro abierto -->
    <path d="M22 66c12-6 26-6 38 2 12-8 26-8 38-2v24c-12-6-26-6-38 2-12-8-26-8-38-2z"
          fill="#FFFFFF" stroke="#2A211A" stroke-width="3.4" stroke-linejoin="round"/>
    <path d="M60 68v24" stroke="#2A211A" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M31 73c8-2 16-1 22 3M67 76c6-4 14-5 22-3" stroke="#C0492E" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Sol -->
    <circle cx="96" cy="26" r="9" fill="#F2B705"/>
  </g>
  <circle cx="60" cy="60" r="58" fill="none" stroke="#2E6B3E" stroke-width="4"/>
</svg>
