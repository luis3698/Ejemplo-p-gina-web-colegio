<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Fundación Reserva para la Infancia">
  <title>Fundación Reserva para la Infancia</title>
  <defs>
    <clipPath id="fri-circle"><circle cx="60" cy="60" r="58"/></clipPath>
  </defs>
  <g clip-path="url(#fri-circle)">
    <circle cx="60" cy="60" r="58" fill="#FBF5E8"/>
    <!-- colina -->
    <path d="M-5 96c22-14 40-8 62-4s45 2 68-9v40H-5z" fill="#E3EFE0"/>
    <!-- árbol -->
    <g>
      <path d="M32 92V70" stroke="#7E5A3C" stroke-width="5" stroke-linecap="round"/>
      <circle cx="32" cy="56" r="17" fill="#4E9B45"/>
      <circle cx="21" cy="63" r="11" fill="#3C8544"/>
      <circle cx="43" cy="63" r="11" fill="#2E6B3E"/>
    </g>
    <!-- casa con techo de teja -->
    <g>
      <rect x="56" y="62" width="42" height="30" rx="3" fill="#FFFFFF" stroke="#3B2F26" stroke-width="2.5"/>
      <path d="M50 63 77 40l27 23z" fill="#C0492E" stroke="#9B3A22" stroke-width="2.5" stroke-linejoin="round"/>
      <rect x="70" y="72" width="14" height="20" rx="1.5" fill="#F2B705" stroke="#3B2F26" stroke-width="2"/>
    </g>
    <!-- niños tomados de la mano -->
    <g stroke-linecap="round">
      <g fill="#2F80A8"><circle cx="22" cy="96" r="4.4"/><path d="M22 100v9M17 112l5-4 5 4M17 104h10" stroke="#2F80A8" stroke-width="3.2" fill="none"/></g>
      <g fill="#E8792B"><circle cx="43" cy="96" r="4.4"/><path d="M43 100v9M38 112l5-4 5 4M38 104h10" stroke="#E8792B" stroke-width="3.2" fill="none"/></g>
      <g fill="#F2B705"><circle cx="64" cy="96" r="4.4"/><path d="M64 100v9M59 112l5-4 5 4M59 104h10" stroke="#F2B705" stroke-width="3.2" fill="none"/></g>
      <g fill="#4E9B45"><circle cx="85" cy="96" r="4.4"/><path d="M85 100v9M80 112l5-4 5 4M80 104h10" stroke="#4E9B45" stroke-width="3.2" fill="none"/></g>
    </g>
    <!-- sol -->
    <circle cx="97" cy="24" r="9" fill="#F2B705"/>
  </g>
  <circle cx="60" cy="60" r="58" fill="none" stroke="#2E6B3E" stroke-width="4"/>
</svg>
